<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f6">
  <title>Dashboard - Todo List</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <a class="brand" href="../index.html" aria-label="Todo List home">TODO LIST</a>

      <div class="sidebar-section">
        <p class="section-label">Workspace</p>
        <nav class="side-nav" aria-label="Task views">
          <a class="nav-item is-active" href="#today" aria-current="location">
            <span>Today</span>
          </a>
          <a class="nav-item" href="#upcoming">
            <span>Upcoming</span>
          </a>
          <a class="nav-item" href="#completed">
            <span>Completed</span>
          </a>
        </nav>
      </div>

      <a class="back-link" href="login.html">Log out</a>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong>My tasks</strong></div>
      </header>

      <div class="content">
        <section class="welcome">
          <div>
            <h1>Tasks</h1>
          </div>
        </section>

        <section class="overview-grid" aria-label="Overview">
          <article class="overview-card">
            <div class="overview-top"><span class="overview-label">Tasks for today</span></div>
            <div class="overview-value">0</div>
          </article>
          <article class="overview-card">
            <div class="overview-top"><span class="overview-label">Completed</span></div>
            <div class="overview-value">0</div>
          </article>
          <article class="progress-card">
            <div>
              <p class="progress-label">Daily progress</p>
              <p class="progress-title">No tasks tracked</p>
            </div>
          </article>
        </section>

        <div class="task-sections">
        <section class="task-panel" id="today" aria-labelledby="task-heading">
          <div class="task-panel-header">
            <div>
              <h2 id="task-heading">Today's tasks</h2>
            </div>
          </div>
        </section>

        <section class="task-panel" id="upcoming" aria-labelledby="upcoming-heading">
          <div class="task-panel-header">
            <div>
              <h2 id="upcoming-heading">Coming up</h2>
            </div>
          </div>
        </section>

        <section class="task-panel" id="completed" aria-labelledby="completed-heading">
          <div class="task-panel-header">
            <div>
              <h2 id="completed-heading">Completed today</h2>
            </div>
          </div>
        </section>
        </div>

        <footer class="page-footer"></footer>
      </div>
    </main>
  </div>

</body>
</html>
