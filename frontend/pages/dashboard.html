<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f6">
  <title>Dashboard - Todo List</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/addTask.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <a class="brand" href="../index.html" aria-label="Todo List home">TODO LIST</a>

      <div class="sidebar-section">
        <p class="section-label">Workspace</p>
        <nav class="side-nav" aria-label="Task views">
          <a class="nav-item is-active" href="#my-tasks" aria-current="location">
          <i class="fa-solid fa-list-check"></i> 
            <span>My tasks</span>
          </a>
        </nav>
      </div>

      <a class="back-link" href="login.html">Log out</a>
    </aside>

    <main class="main-content" id="my-tasks">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong>My tasks</strong></div>
      </header>

      <div class="content">
        <section class="welcome">
          <div>
            <h1>My tasks</h1>
          </div>
          <a class="button button--primary" href="#add-task">
            <span aria-hidden="true">+</span>
            Add task
          </a>
        </section>

        <section class="overview-grid" aria-label="Overview">
          <article class="overview-card">
            <div class="overview-top"><span class="overview-label">Total tasks</span></div>
            <div class="overview-value">0</div>
          </article>
          <article class="overview-card">
            <div class="overview-top"><span class="overview-label">Completed</span></div>
            <div class="overview-value">0</div>
          </article>
          <article class="progress-card">
            <div>
              <p class="progress-label">Daily progress</p>
              <p class="progress-title">No tasks tracked</p>
            </div>
          </article>
        </section>

        <div class="task-sections">
          <section class="task-panel" aria-labelledby="task-list-heading">
            <div class="task-panel-header">
              <div>
                <h2 id="task-list-heading">Tasks</h2>
              </div>
            </div>
            <p class="task-empty">No tasks yet. Add your first task to get started.</p>
          </section>
        </div>

        <footer class="page-footer"></footer>
      </div>
    </main>
  </div>

  <div class="modal-layer" id="add-task" role="dialog" aria-modal="true" aria-labelledby="add-task-title">
    <a class="modal-backdrop" href="#close" aria-label="Close add task dialog" tabindex="-1"></a>

    <div class="modal-panel">
      <div class="modal-header">
        <h2 class="modal-title" id="add-task-title">Add a task</h2>
        <a class="modal-close" href="#close" aria-label="Close add task dialog">
          <span aria-hidden="true">&times;</span>
        </a>
      </div>

      <form class="task-form" action="dashboard.html" method="get">
        <div class="form-field">
          <label for="task-title">Task name</label>
          <input class="form-control" id="task-title" name="title" type="text" placeholder="e.g. Prepare project presentation" maxlength="120" required>
        </div>

        <div class="form-field">
          <label for="task-due">Due date <span class="optional">(optional)</span></label>
          <input class="form-control" id="task-due" name="due" type="date">
        </div>

        <div class="form-actions">
          <div class="form-buttons">
            <a class="button button--ghost" href="#close">Cancel</a>
            <button class="button button--primary" type="submit">Add task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
